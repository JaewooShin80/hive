name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: skill-lint + statusline tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run skill_lint CLI on real plugin
        run: python3 scripts/skill_lint.py .claude/plugins/hive

      - name: Verify SKILLS.md auto-index is in sync
        run: python3 scripts/gen_skills_index.py --check .claude/plugins/hive/SKILLS.md

      - name: Verify CLAUDE.md auto-index is in sync
        run: python3 scripts/gen_skills_index.py --check CLAUDE.md

      - name: Run unit tests
        run: python3 -m unittest discover -s scripts/tests -v

  cross-os:
    name: install + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run unit tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Global install smoke test (install.sh)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          bash ./install.sh --global
          for f in workflows/hive-wave.js commands/hive/spec.md hooks/hive-bash-guard.js settings.json; do
            test -e "$HOME/.claude/$f" || { echo "missing $f"; exit 1; }
          done

      - name: Global install smoke test (install.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'home'
          $env:HOME = $env:USERPROFILE
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          ./install.ps1 --global
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed: $LASTEXITCODE" }
          foreach ($f in 'workflows\hive-wave.js', 'commands\hive\spec.md', 'hooks\hive-bash-guard.js', 'settings.json') {
            if (-not (Test-Path (Join-Path $env:USERPROFILE ".claude\$f"))) { throw "missing $f" }
          }
